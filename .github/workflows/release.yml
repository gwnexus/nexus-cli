name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""
  BINARY_NAME: nexus

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-2vcpu-ubuntu-2204
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-2vcpu-ubuntu-2204
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p nexusctl

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p nexusctl

      - name: Package binary
        shell: bash
        run: |
          ASSET_DIR="nexus-${{ matrix.target }}"
          mkdir -p "${ASSET_DIR}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${ASSET_DIR}/"
          tar -czf "${ASSET_DIR}.tar.gz" "${ASSET_DIR}"

          # Generate SHA256 checksum
          if [[ "$OSTYPE" == "darwin"* ]]; then
            shasum -a 256 "${ASSET_DIR}.tar.gz" > "${ASSET_DIR}.tar.gz.sha256"
          else
            sha256sum "${ASSET_DIR}.tar.gz" > "${ASSET_DIR}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.target }}
          path: |
            nexus-${{ matrix.target }}.tar.gz
            nexus-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -la release-assets/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat <<EOF > release-notes.md
          ## Nexus CLI v${VERSION}

          ### Installation

          **One-liner (recommended):**
          \`\`\`bash
          curl -fsSL https://nexus.gatewarden.eu/install.sh | bash
          \`\`\`

          **Manual download:**
          Download the archive for your platform, extract, and move the \`nexus\` binary to a directory in your PATH.

          | Platform | Asset |
          |----------|-------|
          | macOS Apple Silicon | \`nexus-aarch64-apple-darwin.tar.gz\` |
          | macOS Intel | \`nexus-x86_64-apple-darwin.tar.gz\` |
          | Linux x86_64 | \`nexus-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux ARM64 | \`nexus-aarch64-unknown-linux-gnu.tar.gz\` |

          **Build from source:**
          \`\`\`bash
          cargo install --git https://github.com/gwnexus/nexus-cli.git nexusctl
          \`\`\`

          ### Checksums
          SHA256 checksums are provided as \`.sha256\` files for each asset.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nexus CLI v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
