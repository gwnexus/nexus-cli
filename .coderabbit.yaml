# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Pull request review settings for nexus-cli (Rust workspace: nexus-core,
# nexusctl, tests). The repository is public: review output, summaries and
# learnings must stay within this repository and must not pull in content
# from private sources.

language: en-US
tone_instructions: >-
  Be concise and technical. Lead with correctness, security and data
  exposure issues; mark style remarks as nitpicks. Write in plain English
  without long dashes.
early_access: false

reviews:
  profile: assertive
  # Merging stays a human decision; findings do not block until branch
  # protection is in place.
  request_changes_workflow: false
  fail_commit_status: false
  # Keep the pull request description as the author wrote it; the summary
  # goes into the walkthrough comment instead.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    Summarize the user-visible effect first (commands, flags, config keys,
    output), then internal changes. Never quote internal identifiers.
  auto_title_instructions: >-
    Conventional Commits: type(scope): subject, imperative, lower case
    subject, under 72 characters, no emojis.
  review_status: true
  review_details: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: false
  related_issues: false
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  # Review comments carry the finding and the suggested change only.
  enable_prompt_for_ai_agents: false
  abort_on_close: true

  path_filters:
    - "!Cargo.lock"
    - "!target/**"
    # Workspace files managed outside this repository (kept out of git).
    - "!.nexus/**"
    - "!.claude/**"

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Rust 2021 workspace; CI runs `cargo clippy --workspace --all-targets -- -D warnings`,
        `cargo fmt --check` and the test suite on Linux and macOS.
        - No `unwrap()`/`expect()`/`panic!` on values that come from the network, files,
          the environment or user input outside tests; return `anyhow`/`nexus_core::Error`
          with a message that says what failed and what to do.
        - Blocking work (processes, file scans) inside async code goes through
          `tokio::task::spawn_blocking` or a bounded timeout; network calls that run on
          `nexus run` or `nexus link` must never make the command fail or hang.
        - Child processes: pass arguments as a list (no shell), set stdin to null when
          no input is expected, never forward tokens through argv.
        - Code comments and user messages in English, no long dashes (U+2014); messages
          use colons or commas instead.
        - New behaviour needs tests in the same change.
    - path: "nexus-core/src/api/**"
      instructions: |
        HTTP client and wire types shared with the hub API.
        - HTTPS only, except localhost/127.0.0.1 for development.
        - Tokens never appear in Debug output, logs or error messages.
        - Responses stay bounded by MAX_RESPONSE_BYTES.
        - New response fields are `#[serde(default)]` so older hubs keep working;
          optional request fields use `skip_serializing_if`. A 404 from a newer
          endpoint on an older hub must be handled, not surfaced as a hard error,
          where the command can continue without it.
    - path: "nexus-core/src/{auth,config}/**"
      instructions: |
        Credentials and configuration.
        - Credential files are written with mode 0600 and never printed.
        - Every new global config key gets a serde default, a `Config::set` branch,
          a line in the "valid keys" error and a row in the README configuration table.
        - An `api_url` from a git-tracked project config is only used after the
          trust check; do not add paths that bypass it.
    - path: "nexusctl/src/cmd/{pull,consent,init,reload,push,sync,stash,shadow,shadow_guard,githooks,plugin_env,projection_cleanup,workspace_state}.rs"
      instructions: |
        These commands write platform content into the user's repository.
        - Target paths must be canonical (no `./`, `//`, `/./`, trailing `/`,
          backslashes), stay inside the workspace and never reach `.git` in any
          spelling or through symlinks.
        - Executable content (hooks, settings commands, plugins, MCP servers, layouts,
          scripts) needs consent or `--trust`; `--force`/`--yes` must not imply it.
        - Environment values from files or the platform pass the refused-variable
          filter (code loading, proxies, CA bundles, Nexus credentials).
        - Shadow mode keeps workspace and agent files out of git; flag anything that
          would stage, commit or overwrite a tracked user file silently.
    - path: "nexusctl/src/cmd/run.rs"
      instructions: |
        `nexus run` prepares the environment and launches the selected tool.
        - Anything network-bound before launch is optional, bounded in time and
          never blocks the launch on failure.
        - Variables already set in the shell are never overwritten.
        - Per-project gh profiles must not leave a session less authenticated than
          without Nexus.
    - path: "nexusctl/src/cmd/dispatch_*.rs"
      instructions: |
        Dispatch runner, listener and status.
        - Notices carry only checked fields (short id, project name, enum words);
          free text from another project is only delivered fenced as untrusted data.
        - State and queue files are written atomically; the cursor moves only after
          notices are on disk.
        - Runner tokens never leave the runner file (no logs, no argv, no output).
    - path: "nexusctl/src/main.rs"
      instructions: |
        Clap definitions; help text is also the source of the generated manual pages.
        - Help text: English, Unix style, first line short, no long dashes.
        - A new command, flag or config key also needs the README command list or
          section and a CHANGELOG entry.
        - Keep parse tests next to the existing ones for new commands and flags.
    - path: "tests/**"
      instructions: |
        Integration tests against local stub servers.
        - Bind stubs to 127.0.0.1 with port 0; no requests to real hubs.
        - Use synthetic UUIDs such as 11111111-2222-4333-8444-555555555555; never ids
          copied from a real platform. Build reference-like strings at runtime when a
          literal would match the internal-references check.
        - Tests must pass with NEXUS_API_URL and NEXUS_PRIVATE_TOKEN unset and without
          a terminal.
    - path: "install.sh"
      instructions: |
        Installer run via curl on macOS and Linux.
        - POSIX sh, `set -eu`, quoted variables, portable tools only.
        - Verify the release checksum before installing; fail closed on mismatch or
          download errors; never ask for elevated rights silently.
    - path: ".github/workflows/**"
      instructions: |
        - Least-privilege `permissions`; secrets never echoed.
        - Prefer actions pinned to a full commit SHA.
        - The release workflow does not run the internal-references check; a change
          that weakens CI on main also weakens releases.
    - path: "scripts/ci/**"
      instructions: |
        CI guard scripts with self-tests (`--selftest`). A pattern change must keep the
        self-test meaningful and must not widen what passes.
    - path: ".cargo/config.toml"
      instructions: |
        Platform-specific linker flags belong here, per target, and never in devbox
        configuration or global RUSTFLAGS.
    - path: "**/*.md"
      instructions: |
        Repository docs in English, no long dashes (U+2014).
        - CHANGELOG follows Keep a Changelog; user-visible changes go under
          `[Unreleased]` with a bold lead sentence.
        - README documents every command, flag and config key the binary has.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

  finishing_touches:
    # Changes are written and committed by the project's own workflow so
    # commit messages and authorship follow the repository conventions.
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Conventional Commits format `type(scope): subject` with type one of
        feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert;
        scope optional; subject imperative and lower case; whole title under
        72 characters; no emojis.
    description:
      mode: warning
    docstrings:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "Public repository hygiene"
        mode: error
        instructions: |
          Fail when the diff, the PR title or the PR description adds any of:
          - an architecture decision record number (the letters ADR, a hyphen and digits);
          - an internal coordination identifier: the word "Dispatch" followed by an
            8-character hex id, or task, session or project UUIDs from the platform
            (synthetic test UUIDs with repeating digit groups are fine);
          - internal hostnames, private IP addresses or URLs other than the public default
            API URL already documented in the README;
          - secrets, tokens (prefixes nxs_pat_, nxs_proj_, nxs_run_), private keys or
            credentials, even as examples, unless clearly fake placeholders.
          Pass otherwise.
      - name: "No tooling attribution"
        mode: error
        instructions: |
          Fail when commit messages, the PR title or description, code comments or docs
          added by this PR contain co-author trailers or "generated with/by" notes that
          name a code-writing tool or model, or say the change was produced with such a
          tool. Describing product features of the CLI itself is fine. Pass otherwise.
      - name: "Docs and changelog follow the change"
        mode: warning
        instructions: |
          When the PR adds or changes a command, flag, config key, environment variable,
          output format or file written by the CLI, it must also update README.md and add
          an entry under `## [Unreleased]` in CHANGELOG.md. Pure refactors, tests and CI
          changes need neither. Fail if a user-visible change lacks either update.
      - name: "Tests cover new behaviour"
        mode: warning
        instructions: |
          New or changed behaviour in nexus-core or nexusctl needs unit tests in the module
          or integration tests under tests/. Fail when logic changes without any test change,
          except for pure renames, comments, docs or formatting.
      - name: "Typography"
        mode: warning
        instructions: |
          Fail when added lines in code, comments, user-facing messages or docs contain the
          em dash character (U+2014). Colons, commas, semicolons or parentheses are used
          instead. Existing lines in CHANGELOG history are exempt.

  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    github-checks:
      enabled: true
    # The README uses long lines and wide tables by design; prose linters
    # only add noise here.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true
  art: false
  # Public repository: only members can start commands in review threads.
  allow_non_org_members: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "SECURITY.md"
  # Keep learnings, issues and PR context to this repository so nothing from
  # private repositories reaches public review comments.
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  mcp:
    usage: disabled
  jira:
    usage: disabled
  linear:
    usage: disabled
  automatic_linking_mode: disabled
  automatic_repository_linking: false
